services:
  - type: web
    name: aureus-ai-command-center
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    disk:
      name: aureus-db-data
      mountPath: /app/.data
      sizeGB: 1
